[package]
name = "mp3-silence-mini-rust"
version = "0.1.0"
edition = "2021"
description = "MP3無音検出ミニ（Rust実験版） - Delphi実験版と同じ仕様の Rust 版"

# GUI は windows-sys（生の Win32 API バインディング）だけに依存する。
# Linux 側では parse モジュールのテストだけがビルドされる。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Environment",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# サイズ比較が実験の目的のひとつなので、リリースは小ささ優先。
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
